:root {

}
@media (prefers-color-scheme: dark) {

    --primary: #7fd6cc; --on-primary: #06201f; --tint: #16363a; --accent: #ffbe4d; --accent-ink: #ffd27a;
    --good: #7fe0b0; --good-bg: #16382c; --warn: #ffd77a; --warn-bg: #3d2f10;

}

  --bg: #061619; --surface: #0d2226; --ink: #e8f6f4; --muted: #9dbdb9; --line: #1d3c41;

main.enter > :nth-child(2) { animation-delay: .06s; } main.enter > :nth-child(3) { animation-delay: .12s; } main.enter > :nth-child(n+4) { animation-delay: .18s; }

.hero h2, .hero h3 { color: var(--hero-ink); }

.hero .chips .pill.good { background: rgba(127,224,176,.22); color: #c9f5de; }

.btn[disabled] { opacity: .6; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; padding: 4px 11px; border-radius: 999px; background: var(--tint); color: var(--primary); }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.accent { background: transparent; border: 1px solid var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--ink); min-height: 38px; transition: background .15s ease; }
.chip:hover { background: var(--tint); }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

.score { --p: 80; width: 66px; height: 66px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); position: relative; }
.score::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--surface); }
.score b { position: relative; font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums; color: var(--primary); }
.amount { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--ink); }
.inv-amt { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: -.01em; color: var(--primary); font-variant-numeric: tabular-nums; }

form.stack label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; }

textarea { resize: vertical; min-height: 92px; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }

th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); }

.insight .dot { margin-top: 2px; }
</style>

  function vExplore() {
    var a2 = ui.an, list = exploreList(), states = Object.keys(FOUNDERS.reduce(function (m, x) { m[x.state] = 1; return m; }, {})).sort();
    var html = '<div><p class="label">Business analyst</p><h2 style="margin-top:4px">Explore the data</h2><p class="muted small" style="margin-top:4px">Filter the sample businesses and copy the result as CSV.</p></div>' +
      '<section class="card stack">' + sel('an-sector', 'Sector', ['All sectors'].concat(SECTORS), a2.sector) + sel('an-stage', 'Stage', ['All stages'].concat(STAGES), a2.stage) + sel('an-state', 'State', ['All states'].concat(states), a2.state) + '</section>' +
      '<section class="card stack"><div class="row between"><h3>' + list.length + (list.length === 1 ? ' business' : ' businesses') + '</h3><span class="small muted">Total ask ' + inrLakh(sumOf(list, 'ask')) + ' · Avg readiness ' + Math.round(avgOf(list, 'ready')) + '%</span></div>';
    if (!list.length) return html + '<p class="muted small">No businesses match these filters.</p></section>';
    html += '<div class="tbl-wrap"><table class="wide"><thead><tr><th>Business</th><th>State</th><th>Sector</th><th>Stage</th><th class="num">Ask (₹ lakh)</th><th class="num">Ready</th><th class="num">Sales (₹ lakh)</th></tr></thead><tbody>' +
      list.map(function (x) { return '<tr><td><b>' + esc(x.biz) + '</b></td><td>' + esc(x.state) + '</td><td>' + esc(x.sector) + '</td><td>' + esc(x.stage) + '</td><td class="num">' + x.ask + '</td><td class="num">' + x.ready + '%</td><td class="num">' + x.sales + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<label for="csv-out" class="small" style="font-weight:600">CSV</label><textarea id="csv-out" readonly rows="6" style="min-height:140px;font-size:13px">' + esc(csvText(list)) + '</textarea>' +
      '<div><button class="btn" type="button" data-act="copy-csv">Copy CSV</button></div></section>';
    return html;
  }

  function vCompare() {
    var a2 = ui.an, st = function (sc) {
      var l = FOUNDERS.filter(function (x) { return x.sector === sc; }), by = {};
      l.forEach(function (x) { by[x.state] = (by[x.state] || 0) + 1; });
      var top = Object.keys(by).sort(function (p1, p2) { return by[p2] - by[p1]; })[0];
      return { n: l.length, total: sumOf(l, 'ask'), avgAsk: avgOf(l, 'ask'), ready: Math.round(avgOf(l, 'ready')), sales: avgOf(l, 'sales'), top: top || '-' };
    };
    var A = st(a2.a), B = st(a2.b);
    var rows = [['Founders', A.n, B.n], ['Total ask', inrLakh(A.total), inrLakh(B.total)], ['Average ask', inrLakh(Math.round(A.avgAsk * 10) / 10), inrLakh(Math.round(B.avgAsk * 10) / 10)], ['Average readiness', A.ready + '%', B.ready + '%'], ['Average sales a month', '₹' + A.sales.toFixed(1) + ' lakh', '₹' + B.sales.toFixed(1) + ' lakh'], ['Most founders in', A.top, B.top]];
    var verdict = A.ready === B.ready ? 'Both sectors have the same average readiness.' : '<b>' + esc(A.ready > B.ready ? a2.a : a2.b) + '</b> founders are more ready for funding (' + Math.max(A.ready, B.ready) + '% against ' + Math.min(A.ready, B.ready) + '%).';
    return '<div><p class="label">Business analyst</p><h2 style="margin-top:4px">Compare sectors</h2><p class="muted small" style="margin-top:4px">Put two sectors side by side.</p></div>' +
      '<section class="card stack">' + sel('an-a', 'First sector', SECTORS, a2.a) + sel('an-b', 'Second sector', SECTORS, a2.b) + '</section>' +
      '<section class="card stack"><div class="tbl-wrap"><table><thead><tr><th>Measure</th><th>First</th><th>Second</th></tr></thead><tbody>' +
      rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td><b>' + esc(r[1]) + '</b></td><td><b>' + esc(r[2]) + '</b></td></tr>'; }).join('') + '</tbody></table></div>' +
      '<p class="small">' + verdict + '</p></section><p class="note">Illustrative sample data created for this prototype.</p>';
  }

  /* ---------- render ---------- */
  var lastKey = null;
  function view() { var vs = ROLES[S.role].views, h = (location.hash || '').replace('#', ''); return vs.indexOf(h) >= 0 ? h : vs[0]; }
  function render() {
    $('#lang').innerHTML = ['en', 'hi', 'ta'].map(function (l) { return '<button data-act="lang" data-id="' + l + '" aria-pressed="' + (S.lang === l) + '">' + { en: 'EN', hi: 'हिं', ta: 'த' }[l] + '</button>'; }).join('');
    $('#role').innerHTML = S.role && !ui.pickRole ? '<button class="chip role-btn" type="button" data-act="switch-role" aria-label="Switch role, current role ' + esc(ROLES[S.role].label) + '">' + esc(ROLES[S.role].short) + ' ▾</button>' : '';
    var app = $('#app'), tabs = $('#tabs'), key, html;
    if (!S.role || ui.pickRole) { key = 'role'; html = vRole(); tabs.hidden = true; }
    else if (S.role === 'entrepreneur' && (!S.profile || ui.editing)) { key = 'welcome'; html = vWelcome(); tabs.hidden = true; }
    else if (S.role === 'investor' && (!S.inv || ui.editInv)) { key = 'invsetup'; html = vInvSetup(); tabs.hidden = true; }
    else {
      var v = view(); key = S.role + v; tabs.hidden = false;
      $('#tabs .in').innerHTML = ROLES[S.role].views.map(function (k) { return '<a href="#' + k + '"' + (k === v ? ' aria-current="page"' : '') + '>' + ic(k) + '<span>' + t(k) + '</span></a>'; }).join('');
      html = { matches: vMatches, mentors: vMentors, market: vMarket, toolkit: vToolkit, progress: vProgress, community: vCommunity, deals: vDeals, shortlist: vShort, invprofile: vInvProfile, overview: vOverview, explore: vExplore, compare: vCompare }[v]();
    }
    app.className = key !== lastKey ? 'enter' : ''; lastKey = key;
    app.innerHTML = html;
  }

  /* ---------- actions ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.dataset.act, id = b.dataset.id;
    if (a === 'copy-pitch') { copyText(); return; }
    if (a === 'copy-csv') { copyCsv(); return; }
    if (a === 'lang') { S.lang = id; }
    else if (a === 'edit') { ui.editing = true; }
    else if (a === 'apply') { if (S.applied[id]) { delete S.applied[id]; toast('Application withdrawn'); } else { S.applied[id] = true; toast('Application started. Track it under Progress.'); } }
    else if (a === 'open-slots') { ui.openSlots = id; }
    else if (a === 'slot') { S.sessions.push({ id: id, slot: b.dataset.slot }); ui.openSlots = null; toast('Call booked for ' + b.dataset.slot); }
    else if (a === 'cancel') { S.sessions = S.sessions.filter(function (s) { return s.id !== id; }); toast('Call cancelled'); }
    else if (a === 'rm-prod') { S.products = S.products.filter(function (p) { return p.id !== id; }); }
    else if (a === 'channel') { S.channels[id] = !S.channels[id]; toast(S.channels[id] ? 'Channel switched on' : 'Channel switched off'); }
    else if (a === 'filter') { S.filter = id; }
    else if (a === 'like') { var p = S.posts.filter(function (x) { return x.id === id; })[0]; if (S.liked[id]) { delete S.liked[id]; p.likes--; } else { S.liked[id] = true; p.likes++; } }
    else if (a === 'open-reply') { ui.openReply = ui.openReply === id ? null : id; }
    else if (a === 'tool') { ui.tool = id; }
    else if (a === 'check') { if (S.checks[id]) delete S.checks[id]; else S.checks[id] = true; }
    else if (a === 'role') { S.role = id; ui.pickRole = false; ui.editing = false; ui.editInv = false; }
    else if (a === 'switch-role') { ui.pickRole = true; }
    else if (a === 'iv-sec' || a === 'iv-stage') { var d = invDraft(), arr = a === 'iv-sec' ? d.sectors : d.stages, i = arr.indexOf(id); if (i >= 0) arr.splice(i, 1); else arr.push(id); }
    else if (a === 'edit-inv') { ui.editInv = true; ui.invDraft = null; }
    else if (a === 'deal-save') { if (S.short[id]) { delete S.short[id]; toast('Removed from your shortlist'); } else { S.short[id] = { status: 'saved' }; toast('Saved to your shortlist'); } }
    else if (a === 'deal-intro') { S.short[id] = { status: 'intro' }; toast('Intro requested. This is simulated in the prototype.'); }
    else if (a === 'deal-pass') { S.short[id] = { status: 'passed' }; }
    else if (a === 'deal-remove') { delete S.short[id]; }
    else if (a === 'dl-strong') { ui.dl.strong = !ui.dl.strong; }
    save(); render();
    if (a === 'open-reply' && ui.openReply) { var r = $('#r-text'); if (r) r.focus(); }
  });
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'p-name') ui.draft.prod = e.target.value;
    else if (id === 'p-price') ui.draft.price = e.target.value;
    else if (id === 'c-text') ui.draft.post = e.target.value;
    else if (id === 'c-tag') ui.draft.tag = e.target.value;
    else if (id === 'r-text') ui.draft.reply = e.target.value;
    else if (id === 'idea-text') ui.draft.idea = e.target.value;
    else if (id.indexOf('pt-') === 0 || id.indexOf('cl-') === 0) toolInput(id, e.target);
    else if (id === 'iv-name') invDraft().name = e.target.value;
    else if (id === 'iv-firm') invDraft().firm = e.target.value;
    else if (id === 'iv-cheque') invDraft().cheque = e.target.value;
    else if (id.indexOf('dl-') === 0 || id.indexOf('an-') === 0) filterInput(id, e.target);
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target.id || '';
    if (f === 'profile-form') {
      S.profile = { name: $('#f-name').value.trim(), biz: $('#f-biz').value.trim(), sector: $('#f-sector').value, stage: $('#f-stage').value, state: $('#f-state').value };
      ui.editing = false; toast('Profile saved. Your matches are ready.');
    } else if (f === 'prod-form') {
      S.products.push({ id: 'x' + Date.now(), name: ui.draft.prod.trim(), price: ui.draft.price }); ui.draft.prod = ''; ui.draft.price = ''; toast('Product listed');
    } else if (f === 'post-form') {
      S.posts.unshift({ id: 'u' + Date.now(), author: S.profile.name + ' (you)', tag: ui.draft.tag, text: ui.draft.post.trim(), likes: 0, replies: [] }); ui.draft.post = ''; S.joined = true; toast('Posted to the community');
    } else if (e.target.classList.contains('reply-form')) {
      var pid = e.target.dataset.id, p = S.posts.filter(function (x) { return x.id === pid; })[0];
      p.replies.push({ author: S.profile.name + ' (you)', text: ui.draft.reply.trim() }); ui.draft.reply = ''; ui.openReply = null; S.joined = true; toast('Reply sent');
    } else if (f === 'idea-form') {
      S.idea = $('#idea-text').value.trim();
      toast(S.idea ? 'Investors updated for your idea' : 'Describe your idea first');
    } else if (f === 'inv-form') {
      var dd = invDraft();
      if (!dd.sectors.length) { toast('Pick at least one sector'); return; }
      if (!dd.stages.length) { toast('Pick at least one stage'); return; }
      S.inv = { name: dd.name.trim(), firm: dd.firm.trim(), sectors: dd.sectors.slice(), stages: dd.stages.slice(), cheque: dd.cheque };
      ui.editInv = false; ui.invDraft = null; toast('Investor profile saved');
    } else return;
    save(); render();
  });
  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });
  render();
})();
</script>

</body></html>
